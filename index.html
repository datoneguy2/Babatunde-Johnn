<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading | Babatunde John's Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0d0d0d;
      color: #fff;
      font-family: Arial, sans-serif;
      flex-direction: column;
    }

    /* Loader Circle */
    .loader {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(255,255,255,0.2);
      border-top: 6px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Loading Text */
    .loading-text {
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      animation: fade 2s ease-in-out infinite;
    }

    @keyframes fade {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <div class="loading-text">Loading Babatunde John's Portfolio...</div>

  <script>
    // Redirect after 3 seconds
    setTimeout(() => {
      window.location.href = "index2.html"; 
      // change "portfolio.html" to the actual filename of your portfolio page
    }, 3000);
  </script>
</body>
</html>
